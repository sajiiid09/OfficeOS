<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#f8fafc" />
    <meta name="description" content="OfficeOS — Modern employee management platform for teams, attendance, tasks, and more." />

    <!-- Favicon & Touch Icon -->
    <link rel="icon" href="%PUBLIC_URL%/favicon.ico" />
    <link rel="apple-touch-icon" href="%PUBLIC_URL%/apple-touch-icon.png" />
    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

    <!-- Fonts: Inter (primary) — preconnect for performance -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
      rel="stylesheet"
    />

    <!-- Icons: Font Awesome 5 (single source) -->
    <link
      rel="stylesheet"
      href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"
      integrity="sha384-DyZ88mC6Up2uqS4h/KRgHuoeGwBcD4Ng9SiP4dIRy0EXTlnuz47vAwmeGwVChigm"
      crossorigin="anonymous"
    />

    <!-- Stisla Template CSS (kept for layout compatibility during migration) -->
    <link rel="stylesheet" href="%PUBLIC_URL%/assets/css/style.css" />
    <link rel="stylesheet" href="%PUBLIC_URL%/assets/css/components.css" />

    <title>OfficeOS</title>
  </head>
  <body>
    <noscript>You need to enable JavaScript to run this app.</noscript>

    <!-- Skip to main content link for accessibility -->
    <a href="#main-content" class="sr-only sr-only-focusable">Skip to Main Content</a>

    <div id="root"></div>

    <!--
      Stisla layout scripts (minimal set required for sidebar/navbar toggle).
      jQuery will be removed in a future iteration once all jQuery-dependent
      Stisla behaviors are replaced with React equivalents.
    -->
    <script src="/assets/js/jquery-3.3.1.min.js"></meta>
    <script src="/assets/js/jquery.nicescroll.min.js"></script>
    <script src="/assets/js/scripts.js"></script>
  </body>
</html>
